<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清哥的博客 - 首页预览</title>
    <script src="assets/js/dark-mode.js"></script>
    <style>
        /* Preview styles based on our custom CSS */
        :root {
            /* Light mode colors */
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --text-color: #34495e;
            --light-gray: #ecf0f1;
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --code-bg: #f8f9fa;
            --shadow-color: rgba(0,0,0,0.1);
            --border-radius: 8px;
            --box-shadow: 0 2px 10px var(--shadow-color);
            --transition: all 0.3s ease;
        }

        /* Dark mode colors */
        [data-theme="dark"] {
            --primary-color: #ecf0f1;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --text-color: #bdc3c7;
            --light-gray: #34495e;
            --bg-color: #1a1a1a;
            --card-bg: #2c3e50;
            --border-color: #34495e;
            --code-bg: #2c3e50;
            --shadow-color: rgba(0,0,0,0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            line-height: 1.7;
            color: var(--text-color);
            background: var(--bg-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 3rem;
            font-size: 3rem;
            color: var(--primary-color);
            font-weight: 600;
        }

        .subtitle {
            text-align: center;
            font-size: 1.2rem;
            color: #7f8c8d;
            margin-bottom: 3rem;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--primary-color);
            position: relative;
            padding-bottom: 0.5rem;
        }

        h2:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 3px;
            background: var(--secondary-color);
            border-radius: 2px;
        }

        .post-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .post-preview {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 2rem;
            box-shadow: var(--box-shadow);
            transition: var(--transition);
            border: 1px solid var(--border-color);
        }

        .post-preview:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .post-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            color: #7f8c8d;
        }

        .post-title {
            margin: 1rem 0;
            font-size: 1.5rem;
            line-height: 1.4;
        }

        .post-title a {
            color: var(--primary-color);
            text-decoration: none;
            transition: var(--transition);
        }

        .post-title a:hover {
            color: var(--secondary-color);
        }

        .post-excerpt {
            color: #7f8c8d;
            margin-bottom: 1.5rem;
            line-height: 1.6;
            font-size: 1rem;
        }

        .read-more {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .read-more:hover {
            color: var(--accent-color);
            gap: 0.5rem;
        }

        .category-tag {
            background: var(--light-gray);
            color: var(--primary-color);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        /* Dark mode toggle button */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            display: inline-block;
            width: 60px;
            height: 30px;
            z-index: 1000;
        }

        .theme-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--secondary-color);
        }

        input:checked + .slider:before {
            transform: translateX(30px);
        }

        /* Toggle icon styles */
        .toggle-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            transition: opacity 0.3s ease;
        }

        .sun-icon {
            left: 8px;
            opacity: 1;
        }

        .moon-icon {
            right: 8px;
            opacity: 0;
        }

        [data-theme="dark"] .sun-icon {
            opacity: 0;
        }

        [data-theme="dark"] .moon-icon {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .post-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            h1 {
                font-size: 2rem;
            }

            .post-preview {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Dark mode toggle -->
    <label class="theme-toggle">
        <input type="checkbox" id="theme-toggle-checkbox">
        <span class="slider">
            <span class="toggle-icon sun-icon">☀️</span>
            <span class="toggle-icon moon-icon">🌙</span>
        </span>
    </label>

    <div class="container">
        <h1>欢迎来到清哥的博客</h1>
        <p class="subtitle">专注记录分享通过认知科学构建大模型及智能体的技术洞察与实践经验。</p>

        <h2>最新文章</h2>

        <div class="post-grid">
            <article class="post-preview">
                <div class="post-meta">
                    <time class="post-date">2024年07月28日</time>
                    <span class="post-categories">
                        <span class="category-tag">Jekyll</span>
                        <span class="category-tag">更新</span>
                    </span>
                </div>
                <h3 class="post-title">
                    <a href="#">Welcome to Jekyll!</a>
                </h3>
                <p class="post-excerpt">
                    您将在 _posts 目录中找到这篇文章。继续编辑它并重新构建站点以查看您的更改。您可以通过多种方式重新构建站点...
                </p>
                <a class="read-more" href="#">阅读更多 →</a>
            </article>

            <article class="post-preview">
                <div class="post-meta">
                    <time class="post-date">2024年07月28日</time>
                    <span class="post-categories">
                        <span class="category-tag">认知科学</span>
                        <span class="category-tag">大模型</span>
                    </span>
                </div>
                <h3 class="post-title">
                    <a href="#">从认知科学视角洞察大模型与Agent：记忆、学习、多模态与评估的深度剖析</a>
                </h3>
                <p class="post-excerpt">
                    本文从认知科学视角深入探讨大模型和智能体的关键问题，包括记忆机制、学习范式、多模态处理和评估方法...
                </p>
                <a class="read-more" href="#">阅读更多 →</a>
            </article>
        </div>
    </div>
</body>
</html>
